<!-- MathJax 4 sin la voz, el braille ni la copia enriquecida que genera de serie para cada
     fórmula (cientos de megas en una página con muchas): se queda el MathML que leen los
     lectores de pantalla, y lo demás se activa desde su menú (clic derecho). -->
<script>window.MathJax = { options: { menuOptions: { settings: { enrich: false, speech: false, braille: false, assistiveMml: true } } } };</script>
