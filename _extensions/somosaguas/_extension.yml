title: Nueva Somosaguas
author: Nueva Somosaguas
version: 0.2.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    html:
      lang: es
      theme: somosaguas.scss
      include-in-header: mathjax.html
    typst:
      lang: es
      # Resaltado nativo de Typst, como en la plantilla independiente.
      syntax-highlighting: idiomatic
      font-paths:
        - fonts
      template-partials:
        - typst-template.typ
        - typst-show.typ
